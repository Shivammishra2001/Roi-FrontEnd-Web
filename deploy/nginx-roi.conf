# /etc/nginx/sites-available/roi — rendered by server-setup.sh (phase: nginx)
# One host, two apps:
#   /                       → Next.js   127.0.0.1:__FRONTEND_PORT__
#   /api /admin /uploads …  → Strapi 5  127.0.0.1:__BACKEND_PORT__

upstream roi_frontend { server 127.0.0.1:__FRONTEND_PORT__; keepalive 32; }
upstream roi_backend  { server 127.0.0.1:__BACKEND_PORT__;  keepalive 32; }

# WebSocket / HMR upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Media library uploads (videos, PDFs). Nginx's default of 1M would drop them.
    client_max_body_size 100M;
    client_body_timeout  300s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- Strapi --------------------------------------------------------------
    # /api, /admin, /uploads, /i18n were requested. The Strapi admin panel ALSO
    # calls the plugin routes below at the root path; without them the admin
    # loads but the Content Manager, Media Library and login break.
    location ~ ^/(api|admin|uploads|i18n|content-manager|content-type-builder|upload|users-permissions|email|content-releases|review-workflows|_health)(/|$) {
        proxy_pass http://roi_backend;
        proxy_read_timeout 300s;   # large uploads / migrations
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Uploaded media is immutable (hashed file names) — cache aggressively.
    location ^~ /uploads/ {
        proxy_pass http://roi_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Next.js -------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://roi_frontend;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # On-demand ISR hook: only Strapi's webhook (127.0.0.1:3000 directly) calls it.
    location = /revalidate {
        return 404;
    }

    location / {
        proxy_pass http://roi_frontend;
    }
}
