<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="cadenceArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c24b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5c24b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Technical Grid & Baseline -->
  <line x1="30" y1="145" x2="290" y2="145" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <line x1="30" y1="115" x2="290" y2="115" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="30" y1="85" x2="290" y2="85" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="30" y1="55" x2="290" y2="55" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Week Axis Markers -->
  <text x="36" y="160" fill="#6e6b63" font-family="'JetBrains Mono', monospace" font-size="7">WK 01</text>
  <text x="96" y="160" fill="#6e6b63" font-family="'JetBrains Mono', monospace" font-size="7">WK 04</text>
  <text x="156" y="160" fill="#6e6b63" font-family="'JetBrains Mono', monospace" font-size="7">WK 08</text>
  <text x="216" y="160" fill="#6e6b63" font-family="'JetBrains Mono', monospace" font-size="7">WK 12</text>
  <text x="272" y="160" fill="#f5c24b" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">WK 16+</text>

  <!-- Weekly Cadence Rhythm Bars -->
  <rect x="44" y="130" width="5" height="15" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="68" y="122" width="5" height="23" rx="1.5" fill="rgba(255,255,255,0.25)"/>
  <rect x="92" y="112" width="5" height="33" rx="1.5" fill="rgba(255,255,255,0.32)"/>
  <rect x="116" y="100" width="5" height="45" rx="1.5" fill="rgba(255,255,255,0.42)"/>
  <rect x="140" y="86" width="5" height="59" rx="1.5" fill="rgba(245,194,75,0.45)"/>
  <rect x="164" y="72" width="5" height="73" rx="1.5" fill="rgba(245,194,75,0.6)"/>
  <rect x="188" y="58" width="5" height="87" rx="1.5" fill="rgba(245,194,75,0.75)"/>
  <rect x="212" y="44" width="5" height="101" rx="1.5" fill="#f5c24b"/>
  <rect x="236" y="32" width="5" height="113" rx="1.5" fill="#f5c24b"/>
  <rect x="260" y="20" width="5" height="125" rx="1.5" fill="#f5c24b"/>

  <!-- Decaying Campaign Spike (Contrast) -->
  <path d="M 38 140 Q 75 72 102 140 Q 150 72 178 140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="75" y="68" text-anchor="middle" fill="#6d6a62" font-family="'JetBrains Mono', monospace" font-size="6">CAMPAIGN SPIKE (DECAYS)</text>

  <!-- Compounding Golden Wave -->
  <path d="M 40 134 C 90 128, 150 96, 210 52 S 265 24, 280 18 L 280 145 L 40 145 Z" fill="url(#cadenceArea)"/>
  <path d="M 40 134 C 90 128, 150 96, 210 52 S 265 24, 280 18" fill="none" stroke="#f5c24b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Peak Velocity Node -->
  <circle cx="280" cy="18" r="9" fill="rgba(245,194,75,0.2)"/>
  <circle cx="280" cy="18" r="4.5" fill="#f5c24b"/>

  <!-- Readout Badge -->
  <rect x="180" y="8" width="86" height="18" rx="2" fill="#1b1b19" stroke="#f5c24b" stroke-width="1"/>
  <text x="223" y="20" text-anchor="middle" fill="#f5c24b" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700">COMPOUNDING +340%</text>
</svg>
