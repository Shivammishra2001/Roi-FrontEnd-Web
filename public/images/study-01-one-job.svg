<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Outer Orbit Guides -->
  <circle cx="160" cy="100" r="76" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="160" cy="100" r="48" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Connecting Convergence Rays -->
  <line x1="160" y1="48" x2="160" y2="78" stroke="#f5c24b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="63" r="2.5" fill="#f5c24b"/>

  <line x1="110" y1="129" x2="142" y2="111" stroke="#f5c24b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="126" cy="120" r="2.5" fill="#f5c24b"/>

  <line x1="210" y1="129" x2="178" y2="111" stroke="#f5c24b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="194" cy="120" r="2.5" fill="#f5c24b"/>

  <!-- Central Core (GROWTH) -->
  <circle cx="160" cy="100" r="26" fill="rgba(245,194,75,0.12)"/>
  <circle cx="160" cy="100" r="22" stroke="rgba(245,194,75,0.4)" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="160" cy="100" r="18" fill="#181816" stroke="#f5c24b" stroke-width="2"/>
  <text x="160" y="103" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" letter-spacing="0.05em">GROWTH</text>

  <!-- Top Pod: ORG -->
  <circle cx="160" cy="32" r="16" fill="#1e1e1c" stroke="#f5c24b" stroke-width="1.8"/>
  <text x="160" y="35.5" text-anchor="middle" fill="#f5c24b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">ORG</text>

  <!-- Bottom-Left Pod: PAID -->
  <circle cx="98" cy="136" r="16" fill="#1e1e1c" stroke="rgba(255,255,255,0.85)" stroke-width="1.8"/>
  <text x="98" y="139.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">PAID</text>

  <!-- Bottom-Right Pod: AI -->
  <circle cx="222" cy="136" r="16" fill="#1e1e1c" stroke="rgba(255,255,255,0.85)" stroke-width="1.8"/>
  <text x="222" y="139.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">AI</text>
</svg>
